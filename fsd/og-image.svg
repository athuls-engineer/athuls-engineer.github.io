<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="redGlow" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#e82127" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#050505" />
  <rect width="1200" height="630" fill="url(#redGlow)" />

  <!-- Inner Card Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Tesla Wordmark -->
  <g transform="translate(90, 95) scale(0.65)">
    <path fill="#ffffff" d="M0 .1a9.7 9.7 0 0 0 7 7h11l.5.1v27.6h6.8V7.3L26 7h11a9.8 9.8 0 0 0 7-7H0zm238.6 0h-6.8v34.8H263a9.7 9.7 0 0 0 6-6.8h-30.3V0zm-52.3 6.8c3.6-1 6.6-3.8 7.4-6.9l-38.1.1v20.6h31.1v7.2h-24.4a13.6 13.6 0 0 0-8.7 7h39.9v-21h-31.2v-7h24zm116.2 28h6.7v-14h24.6v14h6.7v-21h-38zM85.3 7h26a9.6 9.6 0 0 0 7.1-7H78.3a9.6 9.6 0 0 0 7 7zm0 13.8h26a9.6 9.6 0 0 0 7.1-7H78.3a9.6 9.6 0 0 0 7 7zm0 14.1h26a9.6 9.6 0 0 0 7.1-7H78.3a9.6 9.6 0 0 0 7 7zM308.5 7h26a9.6 9.6 0 0 0 7-7h-40a9.6 9.6 0 0 0 7 7z"/>
  </g>

  <!-- Live Benchmark Pill -->
  <g transform="translate(850, 90)">
    <rect width="260" height="42" rx="21" fill="rgba(52, 199, 89, 0.12)" stroke="rgba(52, 199, 89, 0.4)" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#34c759" />
    <text x="40" y="27" fill="#34c759" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">7.4X SAFER THAN US AVG</text>
  </g>

  <!-- Telemetry Title -->
  <text x="90" y="250" fill="#8e8e93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="3">FULL SELF-DRIVING (SUPERVISED) FLEET TELEMETRY</text>

  <!-- Odometer Value -->
  <text x="90" y="345" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="86" font-weight="900" letter-spacing="-2">
    14,586,254,064 <tspan fill="#e82127" font-size="52" font-weight="800">MILES</tspan>
  </text>

  <!-- Stats Meta Line -->
  <text x="90" y="415" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
    2M+ Active Autonomous Vehicles  •  12 Global Territories  •  End-to-End Neural Networks
  </text>

  <!-- Divider -->
  <line x1="90" y1="475" x2="1110" y2="475" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Footer Info -->
  <text x="90" y="525" fill="#e82127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="1">tesla-fsd-live.vercel.app</text>
  <text x="1110" y="525" text-anchor="end" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Official Telematics Benchmark  •  Real-Time Odometer</text>
</svg>
